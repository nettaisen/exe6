# The identities with a key of their own (what an object is taken for): the original's
# NameID, which picks the object's actor record (`byte_80182C4`), a field object's look
# (`byte_8021220`) and what a navi wears (`off_8010E0C`, by the record). A link navi's and a
# form's identity has its NameID in navis.toml and forms.toml. First the navis of navi
