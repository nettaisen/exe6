# Written by gen-content (the verification workspace) from the ROM, which its `check`
# compares this with. Edit it when content is renamed or added.
#
# The original's numbers of rule definitions: nothing the traces compare reads them;
# `gen-content check` rebuilds the ROM's tables from the definitions through them.

