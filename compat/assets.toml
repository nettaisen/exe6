# Battle backgrounds (`off_8080F98`), each named for the area whose maps draw it: a battle draws its
# map's (`sub_8081308`: the table at 0x0808139C by map group and number; 0x07 for a real-world map)
# unless its settings state one. The names are the menu's (`sub_811F290`), in full where its twelve
# characters cut one short; docs/frontend.md §1 has the table of them, tools/backgrounds (the
# verification workspace) the names and their areas from the ROM.
[backgrounds]
lans_hp = 0x00  # Lan's HP
acdc_hp = 0x01  # ACDC HP
aquarium_hp = 0x03  # Aquarium HP
sky_hp = 0x04  # Sky HP
green_hp = 0x05  # Green HP
robot_control_comp = 0x06  # RobCtrlComp1 and 2 ("Robot Control Comp" in dialogue); PavilonComp4 too
# the default: the 26 comps of the first comp map (RoboDogComp, the classrooms', the Bathroom, Elevator and Fan comps
# and so on), every real-world map, and what a link battle's settings state
comp = 0x07
# the six comps of the second comp map (Lab'sComp1 and 2, BookComp, HeliportComp, VendngMcComp and Pipe Comp): 0x07's
# picture in another palette
comp_alternate = 0x08
central_area = 0x09  # CentralArea1 to 3
aquarium_comp = 0x0A  # AquarumComp1 to 3 ("AQUARIUM COMP" in dialogue); PavilonComp1 too
seaside_area = 0x0B  # SeasideArea1 to 3
judge_tree_comp = 0x0C  # JdgTreeComp1 to 3 ("JudgeTreeComp" in dialogue); PavilonComp2 too
green_area = 0x0D  # Green Area1 and 2
sky_area = 0x0E  # Sky Area1 and 2
undernet = 0x0F  # Undernet1 to 3 and UndernetZero
# MrWeathrCmp1 to 3 ("Mr.Weather" in dialogue) once the comp's storm is cleared; PavilonComp3 too
mr_weather_comp = 0x10
underground = 0x11  # Underground1 and 2
copybot_comp = 0x12  # CopyBotComp
acdc_area = 0x13  # ACDC Area
graveyard = 0x14  # Graveyard1 and Graveyard; ImmortalArea too
# MrWeathrCmp1 to 3 and PavilonComp3 in place of 0x10, until the comp's event flag is set (its typhoon virus beaten:
# 0x0BE1 to 0x0BE3, 0x0FD2); 0x10's picture with animations of its own
mr_weather_comp_typhoon = 0x15

