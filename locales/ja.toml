# Japanese: the strings the Japanese games (JP Falzar and Gregar) show, by definition key, for
# the frontend's --lang ja (docs/design/text-rendering.md §10). Display text only: the
# battle counts the content's own strings (en.toml: a description's lines, the run message's
# characters per line), so this table changes neither the battle nor the content's hash.
# Written from the Japanese ROMs, which gen-content checks it against.

