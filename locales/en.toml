# The two groups a patch card's screen lists its effects in, by the effects' `group` (@exelib/patch_cards/effects),
# for a tool that lays a card out as its screen does (the build editor's patch cards).
[patch_card_groups]
"parameter" = "Parameter"
"ability" = "Ability"

# The battle themes' names (rules/battle_themes), by their songs' asset names: a player picks one as a
# battle's music, and the app shows it after the game's name ("BN6 Virus Battle"). Ours.
[battle_themes]
"virus-battle" = "Virus Battle"
"boss-battle" = "Boss Battle"
"final-battle" = "vs Cybeast"
"crossover-battle" = "Crossover Battle"

# The words of the battle's lettered pictures, by picture (docs/design/text-rendering.md §12): the enhanced graphics
# draw them in the lettering font in the picture's place, in its look; the original graphics draw the pictures. A
# picture with no words here (the Program Advance's logo) stays a picture. A banner's are `banner.` and its asset name,
# `{n}` its number (the round's, the turn's); the HUD's labels and the chip window's help pictures by their pictures
# (`pictures.ok.title`: the help picture's title, `.words` its words). The US ROMs' words, with the names the banners'
# 20 cells shortened spelled out (TOMAHAWKMAN DELETED, SEARCHMAN, NUMBERMAN, NORMALNAVI: §12.5). Display only: no hash
# and no battle reads them.
# The emotions a navi can be held in (rules/status's `emotion.order`: `EmotionRules::holdable`), by name, for a
# tool that holds a side in one (the app's practice menu). Ours.
[emotions]
"full_synchro" = "Full Synchro"
"angry" = "Angry"
"tired" = "Tired"
"worn_out" = "Very tired"

